[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-computer-control-plane"
version = "0.1.0"
description = "Foundation for a governed AI computer control plane"
requires-python = ">=3.11"
dependencies = [
    "docker>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
